<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Floa Notes</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="workspace.css" />
    <link rel="stylesheet" href="notes.css" />
    </head>
  <body>
    <aside class="sidebar">
      <header class="sidebar-header">
        <div><span class="eyebrow">FLOA</span><h1>Notes</h1></div>
        <button id="new-note" class="icon-button primary" aria-label="New note" title="New note · ⌘N">＋</button>
      </header>
      <label class="note-search"><span aria-hidden="true">⌕</span><input id="note-search" type="search" placeholder="Search notes" aria-label="Search notes" /></label>
      <nav id="note-list" aria-label="Your notes"></nav>
      <footer><span id="note-total">0 notes</span><span>Saved on this Mac</span></footer>
    </aside>
    <main class="workspace">
      <header class="note-header">
        <input id="note-title" aria-label="Note title" maxlength="200" placeholder="Untitled" />
        <div class="note-actions">
          <span id="save-state" role="status" aria-live="polite">Saved</span>
          <button id="duplicate-note" class="icon-button" aria-label="Duplicate note" title="Duplicate note · ⌘D">⧉</button>
          <button id="delete-note" class="icon-button danger" aria-label="Delete note" title="Delete note">⌫</button>
        </div>
      </header>
      <div class="format-toolbar" role="toolbar" aria-label="Text formatting">
        <button data-command="bold" aria-label="Bold" title="Bold · ⌘B"><strong>B</strong></button>
        <button data-command="italic" aria-label="Italic" title="Italic · ⌘I"><em>I</em></button>
        <button data-command="underline" aria-label="Underline" title="Underline · ⌘U"><u>U</u></button>
        <span class="separator"></span>
        <button data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">☷</button>
        <button data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list">1.</button>
        <button data-command="formatBlock" data-value="blockquote" aria-label="Quote" title="Quote">❝</button>
        <button data-command="hiliteColor" data-value="#fff1a6" aria-label="Highlight text" title="Highlight">▰</button>
        <label class="color-control" title="Text color"><span aria-hidden="true">A</span><input id="text-color" type="color" value="#282b31" aria-label="Text color" /></label>
        <label class="color-control" title="Highlight color"><span aria-hidden="true">▰</span><input id="highlight-color" type="color" value="#fff1a6" aria-label="Highlight color" /></label>
        <span class="format-hint">Paste image · text indexed on this Mac</span>
      </div>
      <article id="note-content" class="note-content" contenteditable="true" role="textbox" aria-label="Note content" aria-multiline="true" data-placeholder="Start writing…"></article>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </main>
    <script src="workspace.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
