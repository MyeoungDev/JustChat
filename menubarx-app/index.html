<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floa</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-primary">
        <div class="nav-actions">
          <button id="back" title="Back" aria-label="Back">‹</button>
          <button id="forward" title="Forward" aria-label="Forward">›</button>
          <button id="home-button" title="Start page" aria-label="Start page">⌂</button>
          <button id="reload" title="Reload" aria-label="Reload">↻</button>
        </div>
        <form id="address-form">
          <input id="address" aria-label="Address or search" placeholder="Search or enter address" autocomplete="off" spellcheck="false" />
        </form>
      </div>
      <div class="toolbar-actions" role="group" aria-label="Page and window actions">
        <button id="bookmark" title="Bookmark this page" aria-label="Bookmark this page" aria-pressed="false"><span aria-hidden="true">☆</span><span class="action-label">Favorite</span></button>
        <button id="mute" title="Mute website audio" aria-label="Mute website audio" aria-pressed="false"><span aria-hidden="true">◖</span><span class="action-label">Mute</span></button>
        <button id="pin" title="Keep window on top" aria-label="Keep window on top" aria-pressed="false"><span aria-hidden="true">⌖</span><span class="action-label">Pin</span></button>
        <button id="toggle-size" title="Expand panel" aria-label="Expand panel" aria-pressed="false"><span aria-hidden="true">⤢</span><span class="action-label">Expand</span></button>
        <button id="toggle-screen-fill" title="Fill current screen" aria-label="Fill current screen" aria-pressed="false"><span aria-hidden="true">□</span><span class="action-label">Fill screen</span></button>
        <button id="menu-button" title="Browser menu" aria-label="Browser menu"><span aria-hidden="true">⋯</span><span class="action-label">Actions</span></button>
        <button id="hide" title="Hide window" aria-label="Hide window"><span aria-hidden="true">×</span><span class="action-label">Hide</span></button>
      </div>
    </header>
    <div class="tab-strip">
      <nav class="tabs" id="tabs" role="group" aria-label="Browser tabs"></nav>
      <button id="new-tab" class="new-tab" type="button" title="New tab" aria-label="New tab">+ <span>New tab</span></button>
    </div>
    <div id="find-bar" class="find-bar" role="search" aria-label="Find in page" hidden>
      <input id="find-query" type="search" placeholder="Find in page" aria-label="Find in page" autocomplete="off" />
      <span id="find-count" role="status" aria-live="polite"></span>
      <button id="find-previous" type="button" aria-label="Previous match" title="Previous match">↑</button>
      <button id="find-next" type="button" aria-label="Next match" title="Next match">↓</button>
      <button id="find-close" type="button" aria-label="Close find" title="Close · Escape">×</button>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="home" class="home" hidden>
      <div class="home-inner">
        <div class="brand-mark">F</div>
        <h1>Web, close at hand.</h1>
        <form id="home-form" class="home-search"><input id="home-address" aria-label="Search or enter address" placeholder="Search or enter address" autocomplete="off" /><button>Go</button></form>
        <section class="bookmark-section"><div class="section-heading"><h2>Favorites</h2><div class="favorite-tools"><select id="favorite-folder-filter" aria-label="Filter favorites by folder"><option value="">All folders</option></select><button id="open-history" class="text-button" type="button">History</button><button id="add-favorite" class="text-button" type="button">＋ Add site</button></div></div><div id="bookmarks" class="bookmarks"></div></section>
      </div>
    </main>
    <dialog id="bookmark-editor" class="bookmark-dialog">
      <form id="bookmark-form">
        <h2 id="bookmark-dialog-title">Edit favorite</h2>
        <label>Site name<input id="favorite-title" name="title" maxlength="80" required /></label>
        <label>Website address<input id="favorite-url" name="url" type="url" placeholder="https://example.com" required /></label>
        <label>Tile icon (emoji or letter)<input id="favorite-icon" name="icon" maxlength="8" placeholder="A" /></label>
        <label>Folder<input id="favorite-folder" name="folder" maxlength="40" placeholder="e.g. Work, Reading" list="favorite-folder-options" /></label>
        <datalist id="favorite-folder-options"></datalist>
        <div class="dialog-actions"><button id="cancel-favorite" type="button">Cancel</button><button class="primary" type="submit">Save favorite</button></div>
      </form>
    </dialog>
    <script src="renderer.js"></script>
  </body>
</html>
