<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floa History</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <div><span class="eyebrow">FLOA</span><h1>History</h1><p>Pages you have visited on this Mac.</p></div>
      <button id="clear-history" class="danger" type="button">Clear history</button>
    </header>
    <label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="Search history" autocomplete="off" aria-label="Search history" /><kbd>⌘ Y</kbd></label>
    <main id="entries" aria-live="polite"></main>
    <script src="history.js"></script>
  </body>
</html>
