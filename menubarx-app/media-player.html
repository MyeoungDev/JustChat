<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src file: blob:; img-src 'self' data:; object-src 'none'; base-uri 'none'" />
    <title>Floa Video</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="media-player.css" />
  </head>
  <body>
    <header class="media-toolbar">
      <div class="media-title">
        <strong>Local video</strong>
        <span id="file-name">Choose a video to play</span>
      </div>
      <div class="media-controls">
        <button id="open-video" type="button">Open video…</button>
        <button id="mute-video" type="button" aria-pressed="false">Mute</button>
        <label for="volume">Volume <output id="volume-value">100%</output></label>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="1" />
      </div>
    </header>
    <main>
      <video id="video" controls playsinline preload="metadata"></video>
      <p id="status" role="status" aria-live="polite">Open a video file to start.</p>
    </main>
    <script src="media-player.js"></script>
  </body>
</html>
