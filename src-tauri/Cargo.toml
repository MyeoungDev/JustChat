[package]
name = "just-chat-tauri"
version = "0.1.0"
description = "A small multi-site AI chat shell"
authors = ["MyeoungDev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
